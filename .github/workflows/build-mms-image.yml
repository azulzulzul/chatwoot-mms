name: Build Chatwoot MMS image

# Builds the Chatwoot CE image from this fork and pushes it to GHCR,
# so the Tencent VPS can run the fork instead of the official image.
# Mirrors the official publish_foss_docker.yml, but single-arch (amd64)
# and pushing to ghcr.io/azulzulzul/chatwoot-mms instead of Docker Hub.
# Triggers on every push to develop (including Sync fork) and manually.

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Strip enterprise code
        run: |
          rm -rf enterprise
          rm -rf spec/enterprise

      - name: Set Chatwoot edition
        run: |
          echo -en '\nENV CW_EDITION="ce"' >> docker/Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/azulzulzul/chatwoot-mms:latest
            ghcr.io/azulzulzul/chatwoot-mms:develop-ce
          cache-from: type=gha
          cache-to: type=gha,mode=max
